<!doctype html>
<html><head><meta charset="utf-8"><title>kit viewer</title>
<style>body{margin:0;background:#6b7a58;overflow:hidden}</style></head>
<body>
<script src="three.min.js"></script><script src="geo.js"></script><script src="town.js"></script><script src="buildings.js"></script>
<script>
// ?kinds=a,b,c&era=4&wall=3&roof=1&cul=0&day=1&cell=30&el=0.6  — each kind at true metres in a grid of 'cell' metres, 3/4 view
const q = new URLSearchParams(location.search);
const kit = BKIT.makeKit(); const kinds = (q.get('kinds') || Object.keys(kit).join(',')).split(',').filter(k => kit[k]);
const era = +(q.get('era') || 4), wall = +(q.get('wall') || 1), roof = +(q.get('roof') || 1), cul = +(q.get('cul') || 0), day = +(q.get('day') || 1), cellM = +(q.get('cell') || 30), el = +(q.get('el') || 0.6);
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(W, H); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(day > 0.5 ? 0x8fa6c4 : 0x0a0e18);
const cols = Math.ceil(Math.sqrt(kinds.length * W / H)), rows = Math.ceil(kinds.length / cols);
const spanX = cols * cellM, spanZ = rows * cellM;
const uniforms = { uSunV: { value: new THREE.Vector3() }, uUpV: { value: new THREE.Vector3() }, uDay: { value: day }, uCamAlt: { value: 1 }, uTime: { value: 0 }, uMetres: { value: 1 } };
const mat = new THREE.ShaderMaterial({ uniforms, vertexShader: BKIT.VERT, fragmentShader: BKIT.FRAG });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(spanX * 3, spanZ * 3), new THREE.MeshBasicMaterial({ color: 0x5f6b4c })); ground.rotation.x = -Math.PI / 2; ground.position.y = -0.01; scene.add(ground);
const S = { hut: [7, 4, 7], tipi: [6, 5, 6], longhouse: [16, 5, 7], stilt: [8, 6, 8], adobe: [9, 4.5, 9], pueblo: [14, 7, 10], courtyard: [15, 5.5, 15], courtyardc: [15, 5.5, 15], domehouse: [9, 6, 9], gable: [9, 7.5, 8], hip: [10, 7, 9], curved: [10, 6.5, 9], halftimber: [8, 10, 8], townhouse: [6, 12, 10], mansard: [12, 16, 12], palazzo: [20, 16, 16], terrace: [22, 8.5, 8], tenement: [14, 18, 14], block: [18, 16, 18], blockold: [24, 6, 24], tower: [18, 60, 18], skyscraper: [20, 160, 20], granary: [5, 5, 5], chimney: [3, 30, 3], barn: [14, 6.5, 8], warehouse: [16, 9, 10], windmill: [7, 16, 7], turbine: [3, 90, 3], lamp: [0.4, 7, 0.4], stall: [3.2, 2.8, 2.4], well: [3, 2.5, 3], fountain: [8, 4, 8], statue: [4, 9, 4], obelisk: [3, 18, 3], pier: [70, 1.6, 4], boat: [9, 2.5, 3], ship: [34, 8, 8], crane: [6, 40, 6], menhirs: [20, 3.5, 20], ziggurat: [46, 22, 46], pyramid: [110, 70, 110], steppyramid: [44, 26, 44], temple: [34, 17, 58], colosseum: [150, 45, 120], cathedral: [44, 60, 96], church: [16, 22, 34], basilica: [60, 55, 90], mosque: [50, 40, 50], tajmosque: [60, 55, 60], mudmosque: [36, 18, 36], onion: [24, 34, 40], hall: [48, 18, 26], pagoda: [22, 42, 22], stupa: [40, 26, 40], shikhara: [26, 42, 34], stepped: [60, 34, 60], mound: [70, 12, 70], palace: [110, 22, 40], keep: [26, 30, 26], roundtower: [7, 20, 7], gatehouse: [24, 12, 8], wall: [24, 8, 2.6], palisade: [24, 3.5, 0.6], bastion: [26, 8, 26], station: [70, 18, 30], crystal: [120, 30, 60], irontower: [60, 300, 60], stadium: [190, 40, 150], spire: [70, 600, 70], lighthouse: [16, 55, 16], factory: [42, 11, 26] };
kinds.forEach((k, idx) => {
  const geo = kit[k]; const info = new THREE.InstancedBufferAttribute(new Float32Array(3), 3); geo.setAttribute('aInfo', info);
  const m = new THREE.InstancedMesh(geo, mat, 1); m.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array([0.85, 0.78, 0.62]), 3);
  const sz = S[k] || [10, 8, 10];
  const x = (idx % cols - cols / 2 + 0.5) * cellM, z = (Math.floor(idx / cols) - rows / 2 + 0.5) * cellM;
  m.setMatrixAt(0, new THREE.Matrix4().compose(new THREE.Vector3(x, 0, z), new THREE.Quaternion(), new THREE.Vector3(sz[0], sz[1], sz[2]))); m.count = 1; scene.add(m);
  info.setXYZ(0, era, idx * 0.1, TOWN.packStyle(wall, roof, cul, 0)); info.needsUpdate = true;
});
const aspect = W / H; const half = Math.max(spanX / 2, spanZ / 2 * aspect) * 1.05;
const camera = new THREE.OrthographicCamera(-half, half, half / aspect, -half / aspect, -5000, 5000);
camera.position.set(Math.cos(0.8) * 1000 * Math.cos(el), Math.sin(el) * 1000, Math.sin(0.8) * 1000 * Math.cos(el)); camera.lookAt(0, 0, 0);
const sun = new THREE.Vector3(0.5, 0.75, 0.4).normalize(); const up = new THREE.Vector3(0, 1, 0);
camera.updateMatrixWorld(); const vm = camera.matrixWorldInverse; uniforms.uSunV.value.copy(sun).transformDirection(vm); uniforms.uUpV.value.copy(up).transformDirection(vm); renderer.render(scene, camera);
window.__ready = true;
</script></body></html>
