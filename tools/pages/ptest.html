<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#345}</style></head><body>
<script src="three.min.js"></script>
<script>
const P_VERT = `
    attribute vec3 aCol; attribute float aPhase;
    uniform float uFovK; varying vec3 vCol; varying float vSize, vPhase;
    void main() {
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      float sz = 1.75 * uFovK / max(-mv.z, 1e-7);
      vSize = sz; vCol = aCol; vPhase = aPhase;
      gl_PointSize = clamp(sz, 1.0, 14.0);
      gl_Position = projectionMatrix * mv;
    }`;
const P_FRAG = `
    precision mediump float; uniform float uDay, uTime; varying vec3 vCol; varying float vSize, vPhase;
    void main() {
      vec2 p = gl_PointCoord; float x = abs(p.x - 0.5);
      float head = step(p.y, 0.3) * step(x, 0.16);
      float body = step(0.3, p.y) * step(x, 0.22 + 0.06 * sin(uTime * 6.0 + vPhase * 6.28));
      float a = max(head, body) * smoothstep(1.2, 3.0, vSize) * (0.35 + 0.65 * uDay);
      if (a < 0.05) discard;
      vec3 col = mix(vCol, vec3(0.78, 0.6, 0.45), head) * (0.35 + 0.65 * uDay);
      gl_FragColor = vec4(col, a);
    }`;
const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true }); renderer.setSize(600, 400); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); const camera = new THREE.PerspectiveCamera(45, 1.5, 0.1, 1000); camera.position.set(0, 6, 30); camera.lookAt(0, 0, 0);
const g = new THREE.BufferGeometry(); const N = 50; const pos = new Float32Array(N * 3), col = new Float32Array(N * 3), ph = new Float32Array(N);
for (let i = 0; i < N; i++) { pos[i * 3] = (i % 10 - 5) * 2; pos[i * 3 + 1] = Math.floor(i / 10) * 2; pos[i * 3 + 2] = 0; col[i * 3] = 0.8; col[i * 3 + 1] = 0.2; col[i * 3 + 2] = 0.2; ph[i] = i / N; }
g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('aCol', new THREE.BufferAttribute(col, 3)); g.setAttribute('aPhase', new THREE.BufferAttribute(ph, 1)); g.setDrawRange(0, N);
const uni = { uFovK: { value: 400 / (2 * Math.tan(22.5 * Math.PI / 180)) }, uDay: { value: 1 }, uTime: { value: 0 } };
const pts = new THREE.Points(g, new THREE.ShaderMaterial({ uniforms: uni, vertexShader: P_VERT, fragmentShader: P_FRAG, transparent: true, depthWrite: false })); pts.frustumCulled = false; scene.add(pts);
scene.add(new THREE.Mesh(new THREE.BoxGeometry(4, 1, 4), new THREE.MeshBasicMaterial({ color: 0x888888 })));
renderer.render(scene, camera); window.__ready = true;
</script></body></html>
