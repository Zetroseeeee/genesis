# Builds the 3D model library: mirrors generated source meshes into Releases and publishes game-ready LOD files.
name: Models
on:
  push:
    branches: [main]
    paths:
      - 'assets/models/**'
      - 'tools/models/**'
      - '.github/workflows/models.yml'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: models
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pipeline dependencies
        run: npm ci --prefix tools/models
      - name: Mirror sources, build LODs, publish
        run: |
          set -o pipefail
          node tools/models/pipeline.mjs ci 2>&1 | tee models.log
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish the run log
        if: always()
        run: |
          gh release view ci-logs >/dev/null 2>&1 || gh release create ci-logs --title "CI logs" --notes "Logs from workflow runs." --latest=false
          grep -v -E "^(prune|weld|dedup|flatten|join|simplify|textureCompress|meshopt|reorder|quantize)" models.log > models-last.log || true
          gh release upload ci-logs models-last.log --clobber
        env:
          GH_TOKEN: ${{ github.token }}
