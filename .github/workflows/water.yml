# Makes the water's edge of the real Earth (tools/water/build.py: a field of distances to the nearest shore, from the
# water masks of the Copernicus DEM and the water of ESA WorldCover, both on AWS Open Data - hosts the cloud workspace
# cannot reach) and keeps it in the "water" release, under the name of what it was made from (the builder and the
# rivers the game draws: twelve digits of their SHA-256). tools/water/fetch.mjs brings it into data/w/.
# tools/water/pack.sh runs it.
name: Water
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'build | probe (what the source looks like)'
        required: false
        default: 'build'
      bbox:
        description: 'Only the blocks that touch lon0,lat0,lon1,lat1 (a trial: kept as water-part.tar)'
        required: false
        default: ''
      only:
        description: 'Only these blocks of level 7, as 7/36/4,7/31/8 (a trial)'
        required: false
        default: ''
      sheet:
        description: 'Blocks for the picture to look at, as "36,4 31,8"'
        required: false
        default: ''
      tag:
        description: 'Release to keep it in'
        required: false
        default: 'water'
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: What it needs
        run: python3 -m pip install --quiet --disable-pip-version-check --break-system-packages numpy scipy pillow rasterio edt connected-components-3d || python3 -m pip install --quiet --disable-pip-version-check numpy scipy pillow rasterio edt connected-components-3d
      - name: The source tiles kept from the run before
        if: ${{ github.event.inputs.mode != 'probe' }}
        uses: actions/cache@v4
        with:
          path: tiles
          key: copernicus-wbm-90-${{ github.run_id }}
          restore-keys: |
            copernicus-wbm-90-
      - name: Make
        env:
          MODE: ${{ github.event.inputs.mode }}
          BBOX: ${{ github.event.inputs.bbox }}
          ONLY: ${{ github.event.inputs.only }}
          SHEET: ${{ github.event.inputs.sheet }}
        run: |
          set -euo pipefail
          case "$BBOX$ONLY$SHEET" in *[!0-9.,/\ -]*) echo "bad input"; exit 1;; esac
          mkdir -p out tiles
          if [ "$MODE" = "probe" ]; then python3 tools/water/build.py --probe --out out --tiles tiles 2>&1 | tee out/water_build.log; exit 0; fi
          set -- --out out --tiles tiles
          [ -n "$BBOX" ] && set -- "$@" --bbox "$BBOX"
          [ -n "$ONLY" ] && set -- "$@" --only "$ONLY"
          [ -n "$SHEET" ] && set -- "$@" --sheet "$SHEET"
          python3 tools/water/build.py "$@" 2>&1 | tee out/water_build.log
          echo "$(ls out | wc -l) files in out"; du -sh tiles out      # (never "ls | head" here: with more files than head takes, ls fails on the closed pipe and the step with it - an hour's work was lost so)
      - name: Keep
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
          MODE: ${{ github.event.inputs.mode }}
          PART: ${{ github.event.inputs.bbox }}${{ github.event.inputs.only }}
        run: |
          set -euo pipefail
          case "$TAG" in *[!A-Za-z0-9_-]*|'') echo "bad tag"; exit 1;; esac
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "The water's edge" --notes "The shoreline of the Earth as a field of distances, made by tools/water/build.py from the water masks of the Copernicus DEM (produced using Copernicus WorldDEM-90 (c) DLR e.V. 2010-2014 and (c) Airbus Defence and Space GmbH 2014-2018 provided under COPERNICUS by the European Union and ESA; all rights reserved) and from ESA WorldCover 2021 ((c) ESA WorldCover project 2021 / Contains modified Copernicus Sentinel data (2021) processed by ESA WorldCover consortium; CC BY 4.0)." --latest=false
          gh release upload "$TAG" out/water_build.log -R "$GITHUB_REPOSITORY" --clobber
          [ "$MODE" = "probe" ] && exit 0
          [ -s out/water_sheet.jpg ] && gh release upload "$TAG" out/water_sheet.jpg -R "$GITHUB_REPOSITORY" --clobber
          # The whole Earth is kept under the name of what it was made from (twelve digits of the SHA-256 of the builder and
          # the game's rivers together): the game's build asks for the one its own files make. A trial of some blocks is kept as water-part.tar, and is nobody's pack.
          if [ -n "$PART" ]; then cp out/water.tar water-part.tar; gh release upload "$TAG" water-part.tar -R "$GITHUB_REPOSITORY" --clobber; exit 0; fi
          H="$(cat tools/water/build.py data/rivers.png | sha256sum | cut -c1-12)"
          cp out/water.tar "water-$H.tar"; cp out/index.json "water-$H.json"
          echo "pack $H"
          gh release upload "$TAG" "water-$H.tar" "water-$H.json" -R "$GITHUB_REPOSITORY" --clobber
